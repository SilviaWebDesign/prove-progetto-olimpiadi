<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<link rel="preload" href="/fonts/PPFormula-Condensed-Variable.ttf" as="font" type="font/ttf" crossorigin />
		<link rel="preload" href="/fonts/Supreme-Variable.ttf" as="font" type="font/ttf" crossorigin />
		<style>
			@font-face {
				font-family: 'PP Formula Condensed';
				src: url('/fonts/PPFormula-Condensed-Variable.ttf') format('truetype');
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: 'Supreme Variable';
				src: url('/fonts/Supreme-Variable.ttf') format('truetype');
				font-weight: 100 900;
				font-style: normal;
				font-display: swap;
			}
			html, body {
				margin: 0;
				padding: 0;
				background: #ffffff;
				font-family: 'PP Formula Condensed', sans-serif;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
